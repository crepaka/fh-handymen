<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FH Helpdesk Directory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>FH Helpdesk Directory</h1>
    </header>
    <main>
        <div class="controls">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter"></select>

            <label for="searchBox">Search:</label>
            <input type="text" id="searchBox" placeholder="Type to filter...">
        </div>
        <table id="directoryTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Comments</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
    <footer>
        Community Directory © 2025
    </footer>
    <script src="script.js"></script>
</body>
</html>
