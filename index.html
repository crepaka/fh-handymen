<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FH Helpdesk</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="top-bar">
    <a href="https://friscohillshoa.com/homepage.aspx" target="_blank" class="hoa-link">FH HOA Info</a>
    <button id="feedback-toggle">Send Feedback</button>
  </div>

  <div id="feedback-box" class="feedback-box hidden">
    <textarea id="feedback-input" placeholder="Write your feedback (max 500 characters)"></textarea>
    <button id="feedback-submit">Send</button>
    <span id="feedback-message" class="feedback-message"></span>
  </div>

  <div id="app">
    <!-- Main content inserted by script.js -->
  </div>

  <script src="script.js"></script>
</body>
</html>
