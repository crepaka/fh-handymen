<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FH Helpdesk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="top-link">
  <a href="https://friscohillshoa.com/homepage.aspx" target="_blank">FH HOA Info</a>
</div>
  <h1>FH Helpdesk Directory</h1>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search...">
    <select id="categoryFilter"></select>
  </div>
  <div id="directory" class="cards-container"></div>
  <div class="feedback-section">
    <button id="feedback-toggle">Send Feedback</button>
    <div id="feedback-box" style="display:none; margin-top: 10px;">
      <textarea id="feedback-text" maxlength="500" placeholder="Enter your feedback or contact info (max 500 characters)"></textarea>
      <button id="send-feedback">Send</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
