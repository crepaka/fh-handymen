<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FH Helpdesk Contacts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>FH Helpdesk Directory</h1>
    <div class="filter">
        <label for="categorySelect">Filter by Category:</label>
        <select id="categorySelect">
            <option value="All">All</option>
        </select>
    </div>
    <table id="contactsTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Category</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Comments</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
