<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FH Helpdesk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="top-link">
  <a href="https://friscohillshoa.com/homepage.aspx" target="_blank">FH HOA Info</a>
</div>
  <h1>FH Helpdesk Directory</h1>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search...">
    <select id="categoryFilter"></select>
  </div>
  <div id="directory" class="cards-container"></div>
  
 <form id="feedbackForm">
  <textarea id="feedbackInput" maxlength="500" placeholder="Enter feedback or contact info..."></textarea>
  <button type="submit" id="sendBtn">Send</button>
</form>

  <div id="feedbackMsg" style="display:none; color: green; margin-top: 10px;">Thanks! Your feedback was submitted.</div>
  <script src="script.js"></script>
</body>
</html>
